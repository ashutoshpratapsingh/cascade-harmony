<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Mochi Drop: Chonky Animal Merge — Suika Physics Game!</title>

  <!-- Google Fonts: Fredoka & Bubblegum Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bubblegum+Sans&family=Fredoka:wght@400;600;700;800&family=Quicksand:wght@600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Matter.js (2D Physics Engine) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>

  <style>
    * {
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      font-family: 'Fredoka', 'Quicksand', sans-serif;
    }

    .font-fun {
      font-family: 'Bubblegum Sans', 'Fredoka', cursive;
    }

    body {
      background: radial-gradient(circle at 50% 15%, #fffdf8 0%, #fef3c7 50%, #fae8b4 100%);
      color: #451a03;
    }

    /* Glass Terrarium Border & Wooden Base */
    .jar-container {
      background: rgba(255, 255, 255, 0.45);
      backdrop-filter: blur(8px);
      border: 3.5px solid #d97706;
      border-top: none;
      border-radius: 0 0 32px 32px;
      box-shadow: 
        0 20px 40px -10px rgba(180, 83, 9, 0.25),
        inset 0 0 25px rgba(255, 255, 255, 0.7);
    }

    /* Dotted Danger Line */
    .danger-line {
      border-top: 2.5px dashed #f43f5e;
      box-shadow: 0 0 8px rgba(244, 63, 94, 0.4);
    }

    /* Screen Shake on Big Merge */
    @keyframes jarShakeAnim {
      0%, 100% { transform: translate(0, 0); }
      20% { transform: translate(-6px, 4px) rotate(-0.5deg); }
      40% { transform: translate(6px, -4px) rotate(0.5deg); }
      60% { transform: translate(-4px, 2px); }
      80% { transform: translate(4px, -2px); }
    }
    .jar-shake {
      animation: jarShakeAnim 0.28s cubic-bezier(0.36, 0.07, 0.19, 0.97);
    }

    /* Floating Score Popups */
    @keyframes floatUpFade {
      0% { opacity: 0; transform: translateY(10px) scale(0.8); }
      25% { opacity: 1; transform: translateY(0) scale(1.15); }
      100% { opacity: 0; transform: translateY(-38px) scale(0.9); }
    }
    .floating-score {
      animation: floatUpFade 0.9s cubic-bezier(0.165, 0.84, 0.44, 1) forwards;
    }

    /* Tactile Buttons */
    .touch-btn:active {
      transform: scale(0.92);
      filter: brightness(0.95);
    }

    .hammer-active {
      cursor: crosshair !important;
      animation: pulse 1s infinite;
    }
  </style>
</head>
<body id="appBody" class="flex flex-col justify-between items-center h-full max-h-[100dvh] w-full overflow-hidden select-none">

        <span title="Tier 5: Cat">🐱</span>➔

        <span title="Tier 7: Seal">🦭</span>➔
        <span title="Tier 8: Capybara">🐹</span>➔

  <!-- ========================================================================= -->

    </div>
  </main>

  <!-- ========================================================================= -->
  <footer class="w-full max-w-md mx-auto flex items-center justify-between gap-2 z-20 px-4 pb-3 pt-1">
    <!-- SHAKE JAR BUTTON (TURBULENCE TO UNSTICK PETS) -->

  <!-- GAME OVER / HIGH SCORE MODAL                                              -->
  <!-- ========================================================================= -->

      <div class="bg-amber-100/60 p-3.5 rounded-2xl border border-amber-200 space-y-1.5 text-left text-xs font-bold text-amber-950">

  <!-- ========================================================================= -->
  <!-- JAVASCRIPT: THE COMPLETE MOCHI DROP 2D PHYSICS ENGINE                     -->
  <!-- ========================================================================= -->
  <script>
    /**
     * MOCHI DROP: CHONKY ANIMAL MERGE (SUIKA PHYSICS)
     * ------------------------------------------------
     * 1. 2D Matter.js real physics with squishy restitution, friction & gravity
     * 2. 10 Tiers of Adorable Mochi Animals (Bunny -> Chick -> Hamster -> Shiba -> Cat -> Panda -> Seal -> Capybara -> Bear -> Chonk King)
     * 3. Tactile drag & release drop mechanics with trajectory dotted line
     * 4. Chain combo explosions, shockwaves, floating scores, and screen shake
     * 5. Interactive power-ups: Shake Jar, Squeaky Hammer, Rainbow Jelly
     * 6. Bug-free Web Audio ASMR pop & chime synthesizer
     */

    // =========================================================================
    // 1. ASMR SOUND SYNTHESIZER (Pure Web Audio API — 100% Error-Free)
    // =========================================================================
    class MochiSoundEngine {
      constructor() {
        this.ctx = null;
        this.enabled = true;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx && this.ctx.state === "suspended") {
          this.ctx.resume();
        }
      }

      toggle() {
        this.enabled = !this.enabled;
        return this.enabled;
      }

      // Soft Cute Drop Sound (Kalimba Note)
      playDrop() {
        if (!this.enabled || !this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(520, now);
        osc.frequency.exponentialRampToValueAtTime(260, now + 0.12);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.15);
      }

      // Merge Bubble Pop (Pitch increases with tier!)
      playMerge(tier) {
        if (!this.enabled || !this.ctx) return;
        const now = this.ctx.currentTime;

        // Base Pop
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = "sine";
        const baseFreq = 340 + tier * 75;
        osc.frequency.setValueAtTime(baseFreq, now);
        osc.frequency.exponentialRampToValueAtTime(baseFreq * 2.2, now + 0.08);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.18);

        // Chime for big tiers (Tier 4+)
        if (tier >= 4) {
          const chime = this.ctx.createOscillator();
          const cGain = this.ctx.createGain();
          chime.type = "triangle";
          chime.frequency.setValueAtTime(880 + tier * 60, now + 0.04);
          cGain.gain.setValueAtTime(0.2, now + 0.04);
          cGain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
          chime.connect(cGain);
          cGain.connect(this.ctx.destination);
          chime.start(now + 0.04);
          chime.stop(now + 0.3);
        }
      }

      // Combo Arpeggio
      playCombo(combo) {
        if (!this.enabled || !this.ctx) return;
        const now = this.ctx.currentTime;
        [523.25, 659.25, 783.99, 1046.5].forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const g = this.ctx.createGain();
          const t = now + idx * 0.06;
          osc.type = "triangle";
          osc.frequency.setValueAtTime(freq, t);
          g.gain.setValueAtTime(0.18, t);
          g.gain.exponentialRampToValueAtTime(0.001, t + 0.16);
          osc.connect(g);
          g.connect(this.ctx.destination);
          osc.start(t);
          osc.stop(t + 0.18);
        });
      }

      // Squeaky Hammer Bonk
      playHammer() {
        if (!this.enabled || !this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(820, now);
        osc.frequency.exponentialRampToValueAtTime(280, now + 0.15);
        gain.gain.setValueAtTime(0.35, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.22);
      }

      // Shake Jar Wooden Rattle
      playShake() {
        if (!this.enabled || !this.ctx) return;
        const now = this.ctx.currentTime;
        for (let i = 0; i < 3; i++) {
          const osc = this.ctx.createOscillator();
          const g = this.ctx.createGain();
          const t = now + i * 0.07;
          osc.type = "triangle";
          osc.frequency.setValueAtTime(140 + Math.random() * 80, t);
          g.gain.setValueAtTime(0.2, t);
          g.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
          osc.connect(g);
          g.connect(this.ctx.destination);
          osc.start(t);
          osc.stop(t + 0.12);
        }
      }
    }

    const sound = new MochiSoundEngine();

    // =========================================================================
    // 2. THE 10 MOCHI ANIMAL TIERS (OG CUTE ANIMALS)
    // =========================================================================
    const TIERS = [
      {
        tier: 0,
        name: "Tiny Bunny",
        icon: "🐰",
        radius: 17,
        color: "#fbcfe8",
        border: "#f472b6",
        score: 10
      },
      {
        tier: 1,
        name: "Chubby Chick",
        icon: "🐥",
        radius: 23,
        color: "#fef08a",
        border: "#facc15",
        score: 25
      },
      {
        tier: 2,
        name: "Cozy Hamster",
        icon: "🐹",
        radius: 30,
        color: "#fed7aa",
        border: "#fb923c",
        score: 50
      },
      {
        tier: 3,
        name: "Shiba Inu",
        icon: "🐶",
        radius: 38,
        color: "#fde68a",
        border: "#f59e0b",
        score: 100
      },
      {
        tier: 4,
        name: "Calico Cat",
        icon: "🐱",
        radius: 47,
        color: "#fdba74",
        border: "#ea580c",
        score: 200
      },
      {
        tier: 5,
        name: "Baby Panda",
        icon: "🐼",
        radius: 58,
        color: "#ffffff",
        border: "#3f3f46",
        score: 400
      },
      {
        tier: 6,
        name: "Chubby Seal",
        icon: "🦭",
        radius: 70,
        color: "#bae6fd",
        border: "#38bdf8",
        score: 800
      },
      {
        tier: 7,
        name: "Chill Capybara",
        icon: "🐹",
        isCapy: true,
        radius: 83,
        color: "#d97706",
        border: "#92400e",
        score: 1600
      },
      {
        tier: 8,
        name: "Honey Bear",
        icon: "🐻",
        radius: 98,
        color: "#b45309",
        border: "#78350f",
        score: 3200
      },
      {
        tier: 9,
        name: "CHONK KING",
        icon: "👑",
        isKing: true,
        radius: 114,
        color: "#facc15",
        border: "#ca8a04",
        score: 8000
      }
    ];

    // =========================================================================
    // 3. MATTER.JS PHYSICS SETUP & CANVAS INITIALIZATION
    // =========================================================================
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    let engine, world;
    let canvasW, canvasH;
    const DANGER_LINE_Y = 85;

    // Game Variables
    const STATE = {
      score: 0,
      bestScore: 0,
      totalMerges: 0,
      biggestTierUnlocked: 0,
      isGameOver: false,
      isDropping: false,
      dropX: 180,
      currentTier: 0,
      nextTier: 1,

      // Power-ups
      hammerActive: false,
      hammersRemaining: 2,
      isRainbowReady: false,
      rainbowRemaining: 1,
      shakeCooldown: false,

      // Danger overflow timer
      overflowStartTime: null
    };

    try {
      STATE.bestScore = parseInt(localStorage.getItem("mochi_drop_best") || "0", 10);
      document.getElementById("bestScoreVal").innerText = STATE.bestScore.toLocaleString();
    } catch(e) {}

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvasW = rect.width;
      canvasH = rect.height;
      canvas.width = canvasW * dpr;
      canvas.height = canvasH * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      STATE.dropX = canvasW / 2;
      rebuildPhysicsWalls();
    }

    function initPhysics() {
      engine = Matter.Engine.create({
        gravity: { x: 0, y: 1.15 } // Cozy bouncy gravity
      });
      world = engine.world;

      // Collision Event for Merging
      Matter.Events.on(engine, "collisionStart", handleCollisions);
    }

    let leftWall, rightWall, ground;

    function rebuildPhysicsWalls() {
      if (!world) return;
      if (leftWall) Matter.World.remove(world, [leftWall, rightWall, ground]);

      const wallThick = 40;
      leftWall = Matter.Bodies.rectangle(-wallThick / 2, canvasH / 2, wallThick, canvasH * 2, {
        isStatic: true,
        friction: 0.1,
        restitution: 0.4
      });
      rightWall = Matter.Bodies.rectangle(canvasW + wallThick / 2, canvasH / 2, wallThick, canvasH * 2, {
        isStatic: true,
        friction: 0.1,
        restitution: 0.4
      });
      ground = Matter.Bodies.rectangle(canvasW / 2, canvasH + wallThick / 2 - 4, canvasW * 2, wallThick, {
        isStatic: true,
        friction: 0.2,
        restitution: 0.35
      });

      Matter.World.add(world, [leftWall, rightWall, ground]);
    }

    // =========================================================================
    // 4. PET SPAWNING, DROPPING & AIMING
    // =========================================================================
    function getNextRandomTier() {
      // Spawn small tiers (0 to 3) for the drop queue
      const choices = [0, 0, 0, 1, 1, 2, 2, 3];
      return choices[Math.floor(Math.random() * choices.length)];
    }

    function createPetBody(x, y, tier, isRainbow = false) {
      const tDef = TIERS[tier];
      const radius = tDef.radius;

      const body = Matter.Bodies.circle(x, y, radius, {
        restitution: 0.38, // Squishy bounce
        friction: 0.15,
        frictionAir: 0.015,
        density: 0.002
      });

      body.tier = tier;
      body.isRainbow = isRainbow;
      body.isMerging = false;
      body.wobble = 0;
      body.spawnTime = Date.now();

      return body;
    }

    function dropCurrentPet() {
      if (STATE.isDropping || STATE.isGameOver || STATE.hammerActive) return;
      sound.init();

      STATE.isDropping = true;
      sound.playDrop();

      // Clamp drop X inside jar boundaries
      const curDef = TIERS[STATE.currentTier];
      const clampedX = Math.max(curDef.radius + 6, Math.min(canvasW - curDef.radius - 6, STATE.dropX));

      const isRainbow = STATE.isRainbowReady;
      const pet = createPetBody(clampedX, 48, STATE.currentTier, isRainbow);
      Matter.World.add(world, pet);

      if (isRainbow) {
        STATE.isRainbowReady = false;
      }

      // Cool-down before next pet is ready
      setTimeout(() => {
        STATE.currentTier = STATE.nextTier;
        STATE.nextTier = getNextRandomTier();
        updateNextPreviewUI();
        STATE.isDropping = false;
      }, 480);
    }

    function updateNextPreviewUI() {
      const nextDef = TIERS[STATE.nextTier];
      document.getElementById("nextPetName").innerText = nextDef.name;
      document.getElementById("nextPetIcon").innerText = nextDef.icon;
    }

    // =========================================================================
    // 5. COLLISION & MERGE REACTIONS (THE SUIKA MAGIC!)
    // =========================================================================
    let comboStreak = 0;
    let lastMergeTime = 0;

    function handleCollisions(event) {
      const pairs = event.pairs;

      for (let i = 0; i < pairs.length; i++) {
        const { bodyA, bodyB } = pairs[i];

        if (bodyA.tier !== undefined && bodyB.tier !== undefined) {
          // Check Rainbow Wildcard merge
          const hasRainbow = bodyA.isRainbow || bodyB.isRainbow;

          if ((bodyA.tier === bodyB.tier || hasRainbow) && !bodyA.isMerging && !bodyB.isMerging) {
            const nextTier = Math.min(TIERS.length - 1, Math.max(bodyA.tier, bodyB.tier) + 1);

            // Mark merging to avoid double execution
            bodyA.isMerging = true;
            bodyB.isMerging = true;

            // Compute midpoint
            const midX = (bodyA.position.x + bodyB.position.x) / 2;
            const midY = (bodyA.position.y + bodyB.position.y) / 2;

            // Remove bodies next tick
            setTimeout(() => {
              Matter.World.remove(world, [bodyA, bodyB]);

              // Spawn upgraded pet
              const upgradedPet = createPetBody(midX, midY, nextTier);
              Matter.World.add(world, upgradedPet);

              // Add physics pop impulse
              Matter.Body.setVelocity(upgradedPet, {
                x: (Math.random() - 0.5) * 3,
                y: -2.8
              });

              // Sounds & Effects
              sound.playMerge(nextTier);
              triggerScreenShake();
              spawnMergeParticles(midX, midY, TIERS[nextTier].color);

              // Check Combo Streak
              const now = Date.now();
              if (now - lastMergeTime < 1400) {
                comboStreak++;
                sound.playCombo(comboStreak);
                showComboBanner(comboStreak, (nextTier + 1) * 30);
              } else {
                comboStreak = 1;
              }
              lastMergeTime = now;

              // Award Score
              const pts = TIERS[nextTier].score * comboStreak;
              addScore(pts, midX, midY);

              STATE.totalMerges++;
              if (nextTier > STATE.biggestTierUnlocked) {
                STATE.biggestTierUnlocked = nextTier;
              }
            }, 10);
            break;
          }
        }
      }
    }

    function addScore(pts, x, y) {
      STATE.score += pts;
      document.getElementById("scoreVal").innerText = STATE.score.toLocaleString();

      if (STATE.score > STATE.bestScore) {
        STATE.bestScore = STATE.score;
        document.getElementById("bestScoreVal").innerText = STATE.bestScore.toLocaleString();
        try { localStorage.setItem("mochi_drop_best", STATE.bestScore); } catch(e) {}
      }

      showFloatingScore(`+${pts}`, x, y);
    }

    // =========================================================================
    // 6. RENDER LOOP (CUTE KAWAII ANIMAL SPRITES ON CANVAS)
    // =========================================================================
    function drawScene() {
      ctx.clearRect(0, 0, canvasW, canvasH);

      // 1. Draw Aim Trajectory Dotted Line
      if (!STATE.isDropping && !STATE.isGameOver && !STATE.hammerActive) {
        const curDef = TIERS[STATE.currentTier];
        const clampedX = Math.max(curDef.radius + 6, Math.min(canvasW - curDef.radius - 6, STATE.dropX));

        ctx.save();
        ctx.strokeStyle = "rgba(245, 158, 11, 0.4)";
        ctx.lineWidth = 2.5;
        ctx.setLineDash([6, 6]);
        ctx.beginPath();
        ctx.moveTo(clampedX, 55);
        ctx.lineTo(clampedX, canvasH - 10);
        ctx.stroke();
        ctx.restore();

        // Draw Ready-to-Drop Preview Pet
        drawMochiAnimal(clampedX, 48, curDef, 0, 1.0, STATE.isRainbowReady);
      }

      // 2. Draw All Physical Bodies in Matter.js World
      const bodies = Matter.Composite.allBodies(world);
      bodies.forEach(body => {
        if (body.tier !== undefined && !body.isMerging) {
          const tDef = TIERS[body.tier];
          drawMochiAnimal(body.position.x, body.position.y, tDef, body.angle, 1.0, body.isRainbow);
        }
      });

      // 3. Check Danger Line Overflow
      checkDangerLineOverflow(bodies);
    }

    // Handcrafted Kawaii Vector Renderer on HTML5 Canvas
    function drawMochiAnimal(x, y, tDef, angle = 0, scale = 1.0, isRainbow = false) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);

      const r = tDef.radius * scale;

      // Soft Shadow
      ctx.beginPath();
      ctx.arc(0, r * 0.12, r, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(180, 83, 9, 0.18)";
      ctx.fill();

      // Main Chubby Body
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, Math.PI * 2);
      ctx.fillStyle = isRainbow ? getRainbowGradient() : tDef.color;
      ctx.fill();
      ctx.strokeStyle = isRainbow ? "#c084fc" : tDef.border;
      ctx.lineWidth = Math.max(2, r * 0.08);
      ctx.stroke();

      // SPECIFIC CUTE ANIMAL DETAILS
      if (tDef.tier === 0) {
        // 🐰 Marshmallow Bunny: Long Floppy Pink Ears
        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.ellipse(-r * 0.35, -r * 0.85, r * 0.22, r * 0.5, -0.2, 0, Math.PI * 2);
        ctx.ellipse(r * 0.35, -r * 0.85, r * 0.22, r * 0.5, 0.2, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#f472b6";
        ctx.beginPath();
        ctx.ellipse(-r * 0.35, -r * 0.85, r * 0.12, r * 0.35, -0.2, 0, Math.PI * 2);
        ctx.ellipse(r * 0.35, -r * 0.85, r * 0.12, r * 0.35, 0.2, 0, Math.PI * 2);
        ctx.fill();
      } else if (tDef.tier === 1) {
        // 🐥 Chubby Chick: Orange Beak
        ctx.fillStyle = "#ea580c";
        ctx.beginPath();
        ctx.moveTo(0, r * 0.05);
        ctx.lineTo(-r * 0.2, r * 0.25);
        ctx.lineTo(r * 0.2, r * 0.25);
        ctx.closePath();
        ctx.fill();
      } else if (tDef.tier === 3) {
        // 🐶 Shiba Inu: White Muzzle
        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.ellipse(0, r * 0.25, r * 0.55, r * 0.35, 0, 0, Math.PI * 2);
        ctx.fill();
        // Golden Shiba Ears
        ctx.fillStyle = "#d97706";
        ctx.beginPath();
        ctx.moveTo(-r * 0.7, -r * 0.4);
        ctx.lineTo(-r * 0.4, -r * 0.9);
        ctx.lineTo(-r * 0.15, -r * 0.5);
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(r * 0.7, -r * 0.4);
        ctx.lineTo(r * 0.4, -r * 0.9);
        ctx.lineTo(r * 0.15, -r * 0.5);
        ctx.fill();
      } else if (tDef.tier === 4) {
        // 🐱 Calico Cat: Triangular Ears & Whiskers
        ctx.fillStyle = "#ea580c";
        ctx.beginPath();
        ctx.moveTo(-r * 0.7, -r * 0.4);
        ctx.lineTo(-r * 0.45, -r * 0.95);
        ctx.lineTo(-r * 0.2, -r * 0.55);
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(r * 0.7, -r * 0.4);
        ctx.lineTo(r * 0.45, -r * 0.95);
        ctx.lineTo(r * 0.2, -r * 0.55);
        ctx.fill();
        // Whiskers
        ctx.strokeStyle = "#431407";
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(-r * 0.4, r * 0.15); ctx.lineTo(-r * 0.85, r * 0.1);
        ctx.moveTo(-r * 0.4, r * 0.3); ctx.lineTo(-r * 0.85, r * 0.35);
        ctx.moveTo(r * 0.4, r * 0.15); ctx.lineTo(r * 0.85, r * 0.1);
        ctx.moveTo(r * 0.4, r * 0.3); ctx.lineTo(r * 0.85, r * 0.35);
        ctx.stroke();
      } else if (tDef.tier === 5) {
        // 🐼 Baby Panda: Black Ears & Eye Patches
        ctx.fillStyle = "#27272a";
        ctx.beginPath();
        ctx.arc(-r * 0.65, -r * 0.65, r * 0.25, 0, Math.PI * 2);
        ctx.arc(r * 0.65, -r * 0.65, r * 0.25, 0, Math.PI * 2);
        ctx.fill();
        // Eye patches
        ctx.beginPath();
        ctx.ellipse(-r * 0.35, -r * 0.05, r * 0.22, r * 0.28, -0.2, 0, Math.PI * 2);
        ctx.ellipse(r * 0.35, -r * 0.05, r * 0.22, r * 0.28, 0.2, 0, Math.PI * 2);
        ctx.fill();
      } else if (tDef.tier === 7) {
        // 🐹 Chill Capybara: Orange Fruit On Head!
        ctx.fillStyle = "#f97316";
        ctx.beginPath();
        ctx.arc(0, -r * 0.9, r * 0.22, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "#15803d";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, -r * 1.1); ctx.lineTo(r * 0.1, -r * 1.25);
        ctx.stroke();
      } else if (tDef.tier === 9) {
        // 👑 CHONK KING: Golden Crown!
        ctx.fillStyle = "#fbbf24";
        ctx.strokeStyle = "#b45309";
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(-r * 0.5, -r * 0.85);
        ctx.lineTo(-r * 0.6, -r * 1.25);
        ctx.lineTo(-r * 0.2, -r * 1.05);
        ctx.lineTo(0, -r * 1.35);
        ctx.lineTo(r * 0.2, -r * 1.05);
        ctx.lineTo(r * 0.6, -r * 1.25);
        ctx.lineTo(r * 0.5, -r * 0.85);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      }

      // KAWAII EYES & BLUSHING CHEEKS
      // 1. Eyes
      ctx.fillStyle = (tDef.tier === 5) ? "#ffffff" : "#451a03";
      ctx.beginPath();
      ctx.arc(-r * 0.32, -r * 0.08, r * 0.1, 0, Math.PI * 2);
      ctx.arc(r * 0.32, -r * 0.08, r * 0.1, 0, Math.PI * 2);
      ctx.fill();

      // Eye Sparkles
      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.arc(-r * 0.35, -r * 0.11, r * 0.04, 0, Math.PI * 2);
      ctx.arc(r * 0.29, -r * 0.11, r * 0.04, 0, Math.PI * 2);
      ctx.fill();

      // 2. Rosy Cheeks
      ctx.fillStyle = "rgba(244, 63, 94, 0.45)";
      ctx.beginPath();
      ctx.arc(-r * 0.48, r * 0.18, r * 0.15, 0, Math.PI * 2);
      ctx.arc(r * 0.48, r * 0.18, r * 0.15, 0, Math.PI * 2);
      ctx.fill();

      // 3. Happy Cute Smile
      ctx.strokeStyle = "#451a03";
      ctx.lineWidth = Math.max(1.8, r * 0.06);
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.arc(-r * 0.1, r * 0.2, r * 0.12, 0, Math.PI);
      ctx.arc(r * 0.1, r * 0.2, r * 0.12, 0, Math.PI);
      ctx.stroke();

      ctx.restore();
    }

    function getRainbowGradient() {
      const grad = ctx.createLinearGradient(-30, -30, 30, 30);
      grad.addColorStop(0, '#f43f5e');
      grad.addColorStop(0.25, '#fbbf24');
      grad.addColorStop(0.5, '#34d399');
      grad.addColorStop(0.75, '#38bdf8');
      grad.addColorStop(1, '#c084fc');
      return grad;
    }

    // =========================================================================
    // 7. DANGER LINE & GAME OVER VERIFICATION
    // =========================================================================
    function checkDangerLineOverflow(bodies) {
      if (STATE.isGameOver) return;

      let hasOverflow = false;
      const now = Date.now();

      bodies.forEach(b => {
        // Only settled bodies that aren't newly spawned at top
        if (b.tier !== undefined && b.position.y - TIERS[b.tier].radius < DANGER_LINE_Y && now - b.spawnTime > 1800) {
          hasOverflow = true;
        }
      });

      const dangerLabel = document.getElementById("dangerCountdown");

      if (hasOverflow) {
        if (!STATE.overflowStartTime) {
          STATE.overflowStartTime = now;
        }
        const elapsed = (now - STATE.overflowStartTime) / 1000;
        const remaining = Math.max(0, (3.2 - elapsed).toFixed(0));

        dangerLabel.classList.remove("hidden");
        dangerLabel.innerText = `OVERFLOW IN ${remaining}s!`;

        if (elapsed >= 3.2) {
          triggerGameOver();
        }
      } else {
        STATE.overflowStartTime = null;
        dangerLabel.classList.add("hidden");
      }
    }

    function triggerGameOver() {
      STATE.isGameOver = true;
      const modal = document.getElementById("gameOverModal");
      document.getElementById("finalScoreVal").innerText = STATE.score.toLocaleString();
      document.getElementById("finalMergesVal").innerText = STATE.totalMerges;
      document.getElementById("finalBiggestPetVal").innerText = `${TIERS[STATE.biggestTierUnlocked].name} ${TIERS[STATE.biggestTierUnlocked].icon}`;
      document.getElementById("modalAvatar").innerText = TIERS[STATE.biggestTierUnlocked].icon;

      modal.classList.remove("hidden");
    }

    function resetGame() {
      STATE.score = 0;
      STATE.totalMerges = 0;
      STATE.biggestTierUnlocked = 0;
      STATE.isGameOver = false;
      STATE.isDropping = false;
      STATE.overflowStartTime = null;
      STATE.hammersRemaining = 2;
      STATE.rainbowRemaining = 1;
      STATE.hammerActive = false;
      STATE.isRainbowReady = false;

      document.getElementById("scoreVal").innerText = "0";
      document.getElementById("hammerCountBadge").innerText = "2";
      document.getElementById("rainbowCountBadge").innerText = "1";
      document.getElementById("gameOverModal").classList.add("hidden");

      // Clear physics bodies
      const bodies = Matter.Composite.allBodies(world);
      bodies.forEach(b => {
        if (b.tier !== undefined) Matter.World.remove(world, b);
      });

      STATE.currentTier = getNextRandomTier();
      STATE.nextTier = getNextRandomTier();
      updateNextPreviewUI();
    }

    // =========================================================================
    // 8. POWER-UPS (SHAKE JAR, SQUEAKY HAMMER, RAINBOW JELLY)
    // =========================================================================
    // 1. Shake Jar Button
    document.getElementById("shakeBtn").addEventListener("click", () => {
      sound.init();
      if (STATE.shakeCooldown || STATE.isGameOver) return;
      STATE.shakeCooldown = true;

      sound.playShake();
      triggerJarShake();

      // Apply turbulence physics force to all pets
      const bodies = Matter.Composite.allBodies(world);
      bodies.forEach(b => {
        if (b.tier !== undefined) {
          Matter.Body.applyForce(b, b.position, {
            x: (Math.random() - 0.5) * 0.045,
            y: -0.02
          });
        }
      });

      const badge = document.getElementById("shakeCooldownBadge");
      badge.innerText = "5s";
      badge.className = "bg-zinc-600 text-white text-[9px] font-black px-1.5 rounded-full";

      let secs = 5;
      const interval = setInterval(() => {
        secs--;
        if (secs <= 0) {
          clearInterval(interval);
          STATE.shakeCooldown = false;
          badge.innerText = "READY";
          badge.className = "bg-amber-900 text-amber-100 text-[9px] font-black px-1.5 py-0.2 rounded-full";
        } else {
          badge.innerText = `${secs}s`;
        }
      }, 1000);
    });

    // 2. Squeaky Hammer Button
    document.getElementById("hammerBtn").addEventListener("click", () => {
      sound.init();
      if (STATE.hammersRemaining <= 0 || STATE.isGameOver) return;
      STATE.hammerActive = !STATE.hammerActive;
      canvas.classList.toggle("hammer-active", STATE.hammerActive);
    });

    // 3. Rainbow Wild Jelly
    document.getElementById("rainbowBtn").addEventListener("click", () => {
      sound.init();
      if (STATE.rainbowRemaining <= 0 || STATE.isGameOver || STATE.isRainbowReady) return;
      STATE.rainbowRemaining--;
      document.getElementById("rainbowCountBadge").innerText = STATE.rainbowRemaining;
      STATE.isRainbowReady = true;
      sound.playDrop();
    });

    // =========================================================================
    // 9. USER TOUCH & MOUSE INTERACTION (DRAG & DROP AIMING)
    // =========================================================================
    function getPointerX(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      return clientX - rect.left;
    }

    function getPointerPos(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: clientX - rect.left, y: clientY - rect.top };
    }

    canvas.addEventListener("pointerdown", (e) => {
      sound.init();
      const pos = getPointerPos(e);

      // Hammer Mode Click to Pop
      if (STATE.hammerActive) {
        const bodies = Matter.Composite.allBodies(world);
        for (let b of bodies) {
          if (b.tier !== undefined) {
            const dist = Math.hypot(b.position.x - pos.x, b.position.y - pos.y);
            if (dist < TIERS[b.tier].radius) {
              sound.playHammer();
              spawnMergeParticles(b.position.x, b.position.y, "#f43f5e");
              Matter.World.remove(world, b);
              STATE.hammersRemaining--;
              document.getElementById("hammerCountBadge").innerText = STATE.hammersRemaining;
              STATE.hammerActive = false;
              canvas.classList.remove("hammer-active");
              return;
            }
          }
        }
        STATE.hammerActive = false;
        canvas.classList.remove("hammer-active");
        return;
      }

      STATE.dropX = getPointerX(e);
    });

    canvas.addEventListener("pointermove", (e) => {
      if (!STATE.hammerActive) {
        STATE.dropX = getPointerX(e);
      }
    });

    canvas.addEventListener("pointerup", () => {
      if (!STATE.hammerActive) {
        dropCurrentPet();
      }
    });

    // =========================================================================
    // 10. JUICE, PARTICLES & ANIMATIONS
    // =========================================================================
    function triggerScreenShake() {
      const jar = document.getElementById("jarWrapper");
      jar.classList.remove("jar-shake");
      void jar.offsetWidth;
      jar.classList.add("jar-shake");
    }

    function triggerJarShake() {
      const jar = document.getElementById("jarWrapper");
      jar.classList.remove("jar-shake");
      void jar.offsetWidth;
      jar.classList.add("jar-shake");
    }

    function showFloatingScore(text, x, y) {
      const overlay = document.getElementById("floatingOverlay");
      const el = document.createElement("div");
      el.className = "floating-score absolute font-fun text-sm sm:text-base font-black text-amber-900 bg-amber-200/90 border border-amber-300 px-2.5 py-0.5 rounded-full shadow-md pointer-events-none select-none";
      el.style.left = `${x}px`;
      el.style.top = `${y}px`;
      el.innerText = text;
      overlay.appendChild(el);
      setTimeout(() => el.remove(), 900);
    }

    function showComboBanner(streak, bonus) {
      const banner = document.getElementById("comboBanner");
      banner.innerText = `✨ ${streak}X COMBO SPREE! +${bonus}`;
      banner.classList.remove("hidden");
      setTimeout(() => banner.classList.add("hidden"), 1300);
    }

    function spawnMergeParticles(x, y, color) {
      const overlay = document.getElementById("floatingOverlay");
      for (let i = 0; i < 6; i++) {
        const star = document.createElement("div");
        star.className = "floating-score absolute text-sm pointer-events-none select-none";
        star.innerText = ["✨", "⭐", "💖", "🌸"][Math.floor(Math.random() * 4)];
        star.style.left = `${x + (Math.random() - 0.5) * 45}px`;
        star.style.top = `${y + (Math.random() - 0.5) * 45}px`;
        overlay.appendChild(star);
        setTimeout(() => star.remove(), 850);
      }
    }

    // =========================================================================
    // 11. BUTTONS & MAIN RAF LOOP
    // =========================================================================
    document.getElementById("soundToggleBtn").addEventListener("click", () => {
      sound.init();
      const on = sound.toggle();
      document.getElementById("soundToggleBtn").innerText = on ? "🔊" : "🔇";
    });

    document.getElementById("restartBtn").addEventListener("click", () => {
      sound.init();
      resetGame();
    });

    document.getElementById("playAgainBtn").addEventListener("click", () => {
      sound.init();
      resetGame();
    });

    // MAIN 60 FPS GAME LOOP
    function gameLoop() {
      Matter.Engine.update(engine, 1000 / 60);
      drawScene();
      requestAnimationFrame(gameLoop);
    }

    // START ENGINE
    window.addEventListener("resize", resizeCanvas);
    window.addEventListener("pointerdown", () => sound.init(), { once: true });

    initPhysics();
    resizeCanvas();
    resetGame();
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
