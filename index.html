<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Mochi Pets: Squeeze & Cuddle — Animals Are Liquid!</title>

  <!-- Google Fonts: Fredoka, Quicksand, Bubblegum Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bubblegum+Sans&family=Fredoka:wght@400;600;700;800&family=Quicksand:wght@600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    * {
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      font-family: 'Fredoka', 'Quicksand', sans-serif;
    }

    body {
      background: radial-gradient(circle at 50% 15%, #fffdf7 0%, #fef3c7 45%, #fae8b4 100%);
      color: #451a03;
    }

    .font-fun {
      font-family: 'Bubblegum Sans', 'Fredoka', cursive;
    }

    /* Mochi Squish Animations */
    @keyframes mochiBreathe {
      0%, 100% { transform: scale(1, 1); }
      50% { transform: scale(1.04, 0.96); }
    }
    .mochi-idle {
      animation: mochiBreathe 2.8s ease-in-out infinite;
    }

    @keyframes mochiPick {
      0% { transform: scale(1, 1) translateY(0); }
      40% { transform: scale(0.85, 1.25) translateY(-16px); }
      100% { transform: scale(1.05, 0.95) translateY(-12px); }
    }
    .mochi-picked {
      animation: mochiPick 0.28s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      filter: drop-shadow(0 12px 16px rgba(180, 83, 9, 0.3));
    }

    @keyframes mochiLand {
      0% { transform: scale(0.8, 1.3); }
      50% { transform: scale(1.25, 0.8); }
      75% { transform: scale(0.95, 1.05); }
      100% { transform: scale(1, 1); }
    }
    .mochi-landed {
      animation: mochiLand 0.35s ease-out;
    }

    @keyframes cuddleGlow {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 4px 10px rgba(245, 158, 11, 0.4)); }
      50% { transform: scale(1.08); filter: drop-shadow(0 8px 20px rgba(236, 72, 153, 0.6)); }
    }
    .cuddle-complete {
      animation: cuddleGlow 1.2s ease-in-out infinite;
    }

    /* Floating Hearts on Cuddle */
    @keyframes floatHeart {
      0% { opacity: 0; transform: translateY(0) scale(0.6) rotate(-10deg); }
      30% { opacity: 1; transform: translateY(-16px) scale(1.1) rotate(10deg); }
      100% { opacity: 0; transform: translateY(-45px) scale(0.9) rotate(-15deg); }
    }
    .heart-particle {
      animation: floatHeart 1.1s cubic-bezier(0.165, 0.84, 0.44, 1) forwards;
    }

    /* Woven Basket Styles */
    .basket-shadow {
      box-shadow: 0 10px 25px -5px rgba(120, 53, 15, 0.18), inset 0 2px 4px rgba(255, 255, 255, 0.6);
    }
    .basket-active {
      box-shadow: 0 0 0 3px #f59e0b, 0 12px 28px -4px rgba(245, 158, 11, 0.4) !important;
      transform: translateY(-4px);
    }

    /* Tactile Buttons */
    .touch-btn:active {
      transform: scale(0.92);
      filter: brightness(0.95);
    }
  </style>
</head>
<body id="appBody" class="flex flex-col justify-between items-center h-full max-h-[100dvh] w-full overflow-hidden select-none">

  <!-- ========================================================================= -->
  <!-- TOP HEADER (Level, Stars, Cute Logo & Audio Controls)                     -->
  <!-- ========================================================================= -->

    <!-- RIGHT: SOUND & RESET BUTTONS -->

        ↩️
      </button>
      <button id="restartBtn" class="touch-btn w-9 h-9 rounded-2xl bg-amber-50 border-2 border-amber-200 text-amber-800 text-sm font-black flex items-center justify-center shadow-sm" title="Restart Level">
        🔄
      </button>
      <button id="soundToggleBtn" class="touch-btn w-9 h-9 rounded-2xl bg-amber-50 border-2 border-amber-200 text-amber-800 text-sm font-black flex items-center justify-center shadow-sm" title="Toggle Sound">
        🔊
      </button>
    </div>
  </header>

  <!-- ========================================================================= -->
  <!-- TITLE & COZY INSTRUCTION BANNER                                          -->
  <!-- ========================================================================= -->

  </div>

     * -----------------------------
     * 1. Animals Are Liquid! Tap to stretch and squeeze into cozy baskets.
     * 2. Handcrafted SVG Vector Mochi Animals:
     *    - 🐱 Calico Orange Cat (Meow, cute whiskers)
     *    - 🐶 Shiba Inu Doggo (Happy blep, golden ears)
     *    - 🐹 Sleepy Capybara (Chill king with orange on head)
     *    - 🐼 Baby Bamboo Panda (Chubby cheeks & green sprout)
     *    - 🐰 Marshmallow Bunny (Floppy ears & twitching nose)
     * 3. ASMR Web Audio Synthesizer: Soft kalimba notes, cute squeaks, warm purrs, and victory chime.
     * 4. 100% responsive, accessible in 2 seconds, pure cute dopamine!
     */

    // =========================================================================
    // 1. ASMR COZY AUDIO ENGINE (Pure Web Audio API — Zero External Files)
    // =========================================================================
    class CozyAudioEngine {
      constructor() {
        this.ctx = null;
        this.enabled = true;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx && this.ctx.state === "suspended") {
          this.ctx.resume();
        }
      }

      toggle() {
        this.enabled = !this.enabled;
        return this.enabled;
      }

      // Soft Cute Pick-Up Pop (Kalimba Note)
      playPick() {
        if (!this.enabled || !this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(440, now); // A4
        osc.frequency.exponentialRampToValueAtTime(880, now + 0.1);
        gain.gain.setValueAtTime(0.22, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.14);
      }

      // Squishy Mochi Plop / Land Sound
      playPlop() {
        if (!this.enabled || !this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(620, now);
        osc.frequency.exponentialRampToValueAtTime(260, now + 0.14);
        gain.gain.setValueAtTime(0.28, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.18);
      }

      // Happy Cuddle Purr / Snuggle Chime
      playCuddle() {
        if (!this.enabled || !this.ctx) return;
        const now = this.ctx.currentTime;
        [523.25, 659.25, 783.99, 1046.5].forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          const t = now + idx * 0.08;
          osc.type = "sine";
          osc.frequency.setValueAtTime(freq, t);
          gain.gain.setValueAtTime(0.18, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(t);
          osc.stop(t + 0.28);
        });
      }

      // Level Complete Victory Fanfare (Sparkling Music Box)
      playVictory() {
        if (!this.enabled || !this.ctx) return;
        const now = this.ctx.currentTime;
        const melody = [523.25, 659.25, 783.99, 1046.5, 1318.51, 1567.98];
        melody.forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          const t = now + idx * 0.11;
          osc.type = "triangle";
          osc.frequency.setValueAtTime(freq, t);
          gain.gain.setValueAtTime(0.25, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(t);
          osc.stop(t + 0.45);
        });
      }
    }

            <polygon points="50,54 48,52 52,52" fill="#ec4899"/>
            <path d="M47 56 Q50 58 53 56" fill="none" stroke="#4b5563" stroke-width="1.8" stroke-linecap="round"/>
            <!-- Cheeks -->
            <circle cx="26" cy="54" r="5" fill="#f472b6" opacity="0.5"/>
            <circle cx="74" cy="54" r="5" fill="#f472b6" opacity="0.5"/>
          </svg>
        `
      }
    };

    // =========================================================================
    // 3. LEVEL DESIGN (Progressive, Engaging, 100% Solvable)
    // =========================================================================
    const BASKET_CAPACITY = 3; // Each basket holds 3 cuddled pets

    const LEVELS = [
      // Level 1: Gentle Warmup (Cats & Puppies, 3 baskets)
      {
        baskets: [
          ["CAT", "SHIBA", "CAT"],
          ["SHIBA", "CAT", "SHIBA"],
          [] // Empty cozy basket
        ]
      },
      // Level 2: Meet the Capybara! (Cats, Shibas, Capybaras, 4 baskets)
      {
        baskets: [
          ["CAT", "CAPYBARA", "SHIBA"],
          ["SHIBA", "CAT", "CAPYBARA"],
          ["CAPYBARA", "SHIBA", "CAT"],
          [] // Empty
        ]
      },
      // Level 3: Panda Joins the Cuddle! (4 animal types, 5 baskets)
      {
        baskets: [
          ["PANDA", "CAT", "PANDA"],
          ["SHIBA", "CAPYBARA", "CAT"],
          ["CAPYBARA", "SHIBA", "PANDA"],
          ["CAT", "CAPYBARA", "SHIBA"],
          [] // Empty
        ]
      },
      // Level 4: Bunny Hop! (5 animal types, 6 baskets)
      {
        baskets: [
          ["BUNNY", "CAT", "SHIBA"],
          ["PANDA", "CAPYBARA", "BUNNY"],
          ["CAT", "SHIBA", "PANDA"],
          ["CAPYBARA", "BUNNY", "CAT"],
          ["SHIBA", "PANDA", "CAPYBARA"],
          [] // Empty
        ]
      },
      // Level 5: Master Cuddler (5 types with 2 empty beds, deeper strategy)
      {
        baskets: [
          ["CAT", "PANDA", "SHIBA"],
          ["BUNNY", "CAPYBARA", "CAT"],
          ["PANDA", "SHIBA", "BUNNY"],
          ["CAPYBARA", "CAT", "PANDA"],
          ["SHIBA", "BUNNY", "CAPYBARA"],
          [], // Empty
          []  // Empty
        ]
      }
    ];

    // =========================================================================
    // 4. GAME STATE & HISTORY FOR UNDO
    // =========================================================================
    const STATE = {
      levelIdx: 0,
      baskets: [],
      selectedBasketIdx: null,
      history: [],
      isWon: false,
      extraBedUsed: false
    };

    // =========================================================================
    // 5. BASKET RENDERING & SQUISHY MOCHI ART
    // =========================================================================
    const container = document.getElementById("basketsContainer");

    function renderLevel() {
      container.innerHTML = "";
      const totalBaskets = STATE.baskets.length;

      // Update Header Info
      document.getElementById("levelLabel").innerText = `LEVEL ${STATE.levelIdx + 1}`;
      document.getElementById("undoBtn").disabled = STATE.history.length === 0;

      // Count cuddled complete baskets
      const cuddledCount = STATE.baskets.filter(isBasketComplete).length;
      const totalNeeded = STATE.baskets.filter(b => b.length > 0).length;
      document.getElementById("cuddleText").innerText = `${cuddledCount} CUDDLED`;

      // Update Friends Icons in Footer
      const activeTypes = new Set();
      STATE.baskets.forEach(b => b.forEach(type => activeTypes.add(type)));
      const iconsHtml = Array.from(activeTypes).map(t => PET_DEFS[t]?.icon || "🐾").join(" ");
      document.getElementById("petIconsRow").innerText = iconsHtml;

      // Render Each Woven Basket
      STATE.baskets.forEach((basketPets, bIdx) => {
        const isSelected = STATE.selectedBasketIdx === bIdx;
        const isComplete = isBasketComplete(basketPets);

        const basketWrap = document.createElement("div");
        basketWrap.className = `flex flex-col items-center justify-end relative cursor-pointer transition-all duration-200 select-none ${isSelected ? 'basket-active' : ''}`;
        basketWrap.style.width = totalBaskets > 5 ? "85px" : (totalBaskets > 4 ? "95px" : "105px");

        // The Woven Basket Dish
        const basketDish = document.createElement("div");
        basketDish.className = `w-full rounded-3xl p-2 sm:p-2.5 flex flex-col-reverse items-center gap-1.5 transition-all duration-200 basket-shadow ${
          isComplete 
            ? 'bg-gradient-to-b from-amber-200 to-amber-300 border-2 border-amber-400 cuddle-complete' 
            : (isSelected ? 'bg-amber-100 border-2 border-amber-400' : 'bg-[#fffcf7] border-2 border-amber-200/80 hover:border-amber-300')
        }`;
        basketDish.style.minHeight = totalBaskets > 5 ? "150px" : "175px";

        // If basket is complete -> Show giant cuddling mega-pet!
        if (isComplete) {
          const petDef = PET_DEFS[basketPets[0]];
          basketDish.innerHTML = `
            <div class="w-full flex flex-col items-center justify-center py-2 animate-bounce">
              <div class="w-16 h-16 sm:w-20 sm:h-20">
                ${petDef.svg}
              </div>
              <div class="mt-1 bg-amber-900/10 text-amber-950 font-black text-[9px] px-2 py-0.5 rounded-full flex items-center gap-1">
                <span>💖</span> COZY!
              </div>
            </div>
          `;
        } else {
          // Render individual pets stacked in basket (from bottom to top)
          for (let pIdx = 0; pIdx < BASKET_CAPACITY; pIdx++) {
            const petType = basketPets[pIdx];
            const slot = document.createElement("div");
            slot.className = "w-full flex items-center justify-center relative";
            slot.style.height = totalBaskets > 5 ? "40px" : "48px";

            if (petType) {
              const petDef = PET_DEFS[petType];
              const isTop = (pIdx === basketPets.length - 1);
              const isBeingHeld = (isSelected && isTop);

              slot.innerHTML = `
                <div class="w-12 h-12 sm:w-14 sm:h-14 transition-all duration-200 ${isBeingHeld ? 'mochi-picked' : 'mochi-idle'}">
                  ${petDef.svg}
                </div>
              `;
            } else {
              // Empty slot placeholder (soft cushion indicator)
              slot.innerHTML = `
                <div class="w-8 h-2 rounded-full bg-amber-900/5 border border-dashed border-amber-900/15"></div>
              `;
            }
            basketDish.appendChild(slot);
          }
        }

        // Basket Base Label / Tag
        const tag = document.createElement("div");
        tag.className = "mt-1.5 text-[10px] font-bold text-amber-900/70 flex items-center gap-1";
        if (isComplete) {
          tag.innerHTML = `<span class="text-rose-500">💖</span> Done`;
        } else if (basketPets.length === 0) {
          tag.innerHTML = `<span class="opacity-60">Cozy Bed</span>`;
        } else {
          tag.innerHTML = `<span>${basketPets.length}/${BASKET_CAPACITY}</span>`;
        }

        basketWrap.appendChild(basketDish);
        basketWrap.appendChild(tag);

        // Tap on Basket to Select or Move
        basketWrap.addEventListener("click", () => handleBasketTap(bIdx));

        container.appendChild(basketWrap);
      });
    }

    function isBasketComplete(pets) {
      if (pets.length !== BASKET_CAPACITY) return false;
      return pets.every(p => p === pets[0]);
    }

    // =========================================================================
    // 6. CORE GAMEPLAY INTERACTION (TAP & SQUEEZE)
    // =========================================================================
    function handleBasketTap(targetIdx) {
      sound.init();
      if (STATE.isWon) return;

      const currentSelected = STATE.selectedBasketIdx;

      // 1. If NO basket is selected yet: Pick up top pet from target
      if (currentSelected === null) {
        const sourcePets = STATE.baskets[targetIdx];
        if (sourcePets.length === 0) return; // Can't pick from empty basket
        if (isBasketComplete(sourcePets)) return; // Already happily cuddled!

        STATE.selectedBasketIdx = targetIdx;
        sound.playPick();
        renderLevel();
        return;
      }

      // 2. If clicking the SAME basket again: Deselect
      if (currentSelected === targetIdx) {
        STATE.selectedBasketIdx = null;
        renderLevel();
        return;
      }

      // 3. Move pet from currentSelected -> targetIdx
      const sourcePets = STATE.baskets[currentSelected];
      const destPets = STATE.baskets[targetIdx];

      // Validate destination basket
      if (destPets.length >= BASKET_CAPACITY) {
        // Destination is full!
        STATE.selectedBasketIdx = targetIdx; // Switch selection
        sound.playPick();
        renderLevel();
        return;
      }

      const movingPet = sourcePets[sourcePets.length - 1];
      const destTopPet = destPets.length > 0 ? destPets[destPets.length - 1] : null;

      // Move is valid if dest is empty OR dest top pet matches moving pet
      if (destTopPet === null || destTopPet === movingPet) {
        // Save history for Undo
        saveHistory();

        // Perform move
        sourcePets.pop();
        destPets.push(movingPet);
        STATE.selectedBasketIdx = null;

        sound.playPlop();

        // Check if destination just cuddled same species
        if (destPets.length > 1 && destPets[destPets.length - 2] === movingPet) {
          sound.playCuddle();
          spawnHearts(targetIdx);
        }

        renderLevel();
        checkVictoryCondition();
      } else {
        // Invalid destination: switch selection to target
        if (destPets.length > 0 && !isBasketComplete(destPets)) {
          STATE.selectedBasketIdx = targetIdx;
          sound.playPick();
        } else {
          STATE.selectedBasketIdx = null;
        }
        renderLevel();
      }
    }

    function saveHistory() {
      const snap = STATE.baskets.map(b => [...b]);
      STATE.history.push(snap);
      if (STATE.history.length > 15) STATE.history.shift();
    }

    function undoMove() {
      if (STATE.history.length === 0) return;
      sound.init();
      const lastSnap = STATE.history.pop();
      STATE.baskets = lastSnap;
      STATE.selectedBasketIdx = null;
      renderLevel();
    }

    // =========================================================================
    // 7. VICTORY CHECK & LEVEL PROGRESSION
    // =========================================================================
    function checkVictoryCondition() {
      // Level is won if all non-empty baskets are complete
      const allComplete = STATE.baskets.every(b => b.length === 0 || isBasketComplete(b));

      if (allComplete) {
        STATE.isWon = true;
        sound.playVictory();

        setTimeout(() => {
          showVictoryModal();
        }, 500);
      }
    }

    function showVictoryModal() {
      const modal = document.getElementById("victoryModal");
      const quote = document.getElementById("victoryQuote");
      const avatar = document.getElementById("victoryPetAvatar");

      // Pick random completed pet for avatar
      const completedTypes = STATE.baskets.filter(b => b.length > 0).map(b => b[0]);
      const chosenType = completedTypes[Math.floor(Math.random() * completedTypes.length)] || "CAT";
      const petDef = PET_DEFS[chosenType];

      avatar.innerText = petDef.icon;
      quote.innerText = petDef.quote;

      modal.classList.remove("hidden");
    }

    function startLevel(lvlIdx) {
      STATE.levelIdx = lvlIdx % LEVELS.length;
      const levelData = LEVELS[STATE.levelIdx];

      // Deep copy level baskets
      STATE.baskets = levelData.baskets.map(b => [...b]);
      STATE.selectedBasketIdx = null;
      STATE.history = [];
      STATE.isWon = false;
      STATE.extraBedUsed = false;

      document.getElementById("addBasketBtn").disabled = false;
      document.getElementById("extraBedBadge").innerText = "1";
      document.getElementById("victoryModal").classList.add("hidden");

      renderLevel();
    }

    // Extra Basket Helper Perk
    document.getElementById("addBasketBtn").addEventListener("click", () => {
      sound.init();
      if (!STATE.extraBedUsed && !STATE.isWon) {
        STATE.extraBedUsed = true;
        saveHistory();
        STATE.baskets.push([]); // Add new empty cozy basket!
        document.getElementById("addBasketBtn").disabled = true;
        document.getElementById("extraBedBadge").innerText = "0";
        sound.playCuddle();
        renderLevel();
      }
    });

    // Spawn Floating Hearts Particles
    function spawnHearts(basketIdx) {
      const overlay = document.getElementById("particleOverlay");
      for (let i = 0; i < 4; i++) {
        const heart = document.createElement("div");
        heart.className = "heart-particle absolute text-xl pointer-events-none select-none";
        heart.innerText = ["💖", "💕", "✨", "🌸"][Math.floor(Math.random() * 4)];

        const x = window.innerWidth / 2 + (Math.random() - 0.5) * 160;
        const y = window.innerHeight / 2 + (Math.random() - 0.5) * 80;
        heart.style.left = `${x}px`;
        heart.style.top = `${y}px`;

        overlay.appendChild(heart);
        setTimeout(() => heart.remove(), 1100);
      }
    }

    // =========================================================================
    // 8. BUTTON LISTENERS & STARTUP
    // =========================================================================
    document.getElementById("undoBtn").addEventListener("click", undoMove);
    document.getElementById("restartBtn").addEventListener("click", () => startLevel(STATE.levelIdx));
    document.getElementById("nextLevelBtn").addEventListener("click", () => startLevel(STATE.levelIdx + 1));

    document.getElementById("soundToggleBtn").addEventListener("click", () => {
      sound.init();
      const on = sound.toggle();
      document.getElementById("soundToggleBtn").innerText = on ? "🔊" : "🔇";
    });

    window.addEventListener("pointerdown", () => sound.init(), { once: true });

    // START FIRST COZY LEVEL
    startLevel(0);
  </script>
</body>
</html>
