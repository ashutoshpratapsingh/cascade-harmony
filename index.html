<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>GTA: Street Getaway — 5-Star Police Chase</title>
  
  <!-- Google Fonts: Orbitron & Rajdhani for aggressive street racing & GTA typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@600;700;800&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    * {
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      font-family: 'Rajdhani', sans-serif;
    }

    .font-hud {
      font-family: 'Orbitron', monospace, sans-serif;
    }

    body {
      background: #09090e;
      color: #fff;
    }

    /* Screen Shake on Crash or Explosion */
    @keyframes screenShakeAnim {
      0%, 100% { transform: translate(0, 0); }
      20% { transform: translate(-6px, 5px) rotate(-1deg); }
      40% { transform: translate(6px, -4px) rotate(1deg); }
      60% { transform: translate(-4px, 3px); }
      80% { transform: translate(4px, -2px); }
    }
    .screen-shake {
      animation: screenShakeAnim 0.32s cubic-bezier(0.36, 0.07, 0.19, 0.97);
    }

    /* Wanted Star Flash (GTA Style) */
    @keyframes starPulse {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 4px #eab308); }
      50% { transform: scale(1.3); filter: drop-shadow(0 0 14px #ef4444); }
    }
    .wanted-active {
      animation: starPulse 0.7s ease-in-out infinite;
      color: #eab308;
    }
    .wanted-inactive {
      color: #4b5563;
      opacity: 0.45;
    }

    /* Red/Blue Siren Flashes on Screen Edges at High Stars */
    @keyframes policeStrobeLeft {
      0%, 100% { box-shadow: inset 18px 0 25px -10px rgba(59, 130, 246, 0.6); }
      50% { box-shadow: inset 18px 0 25px -10px rgba(239, 68, 68, 0.6); }
    }
    .siren-strobe {
      animation: policeStrobeLeft 0.5s ease-in-out infinite alternate;
    }

    /* Bouncy Touch Controls */
    .touch-btn-press:active {
      background: rgba(255, 255, 255, 0.22);
      transform: scale(0.97);
    }
  </style>
</head>
<body id="appBody" class="flex flex-col justify-between items-center h-full max-h-[100dvh] w-full overflow-hidden select-none bg-black">

  <!-- ============================================ -->
  <!-- TOP GTA HUD (Wanted Stars, Cash, Health)     -->
  <!-- ============================================ -->
  <header class="w-full max-w-lg mx-auto flex items-center justify-between z-20 px-3 py-1.5 bg-black/80 backdrop-blur-md border-b-2 border-amber-500/50 shadow-2xl">
    <!-- CASH LOOT COUNTER (GTA Style Green Money) -->
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-lg bg-emerald-950 border border-emerald-500 flex items-center justify-center text-emerald-400 font-black text-sm shadow">
        $
      </div>
      <div>
        <div class="text-[8px] uppercase tracking-widest text-slate-400 font-bold leading-none">HEIST LOOT</div>
        <div id="cashVal" class="font-hud text-sm sm:text-base font-black text-emerald-400 tabular-nums leading-tight drop-shadow">
          $10,000
        </div>
      </div>
    </div>

    <!-- 5-STAR WANTED LEVEL -->
    <div class="flex flex-col items-center">
      <div class="text-[7.5px] uppercase tracking-widest text-slate-400 font-black leading-none mb-0.5">WANTED LEVEL</div>
      <div id="starsContainer" class="flex items-center gap-1 text-base sm:text-lg">
        <span class="star-item wanted-active">★</span>
        <span class="star-item wanted-inactive">★</span>
        <span class="star-item wanted-inactive">★</span>
        <span class="star-item wanted-inactive">★</span>
        <span class="star-item wanted-inactive">★</span>
      </div>
    </div>

    <!-- HEALTH & SOUND -->
    <div class="flex items-center gap-2">
      <!-- Car Armor / Health Bar -->
      <div class="text-right">
        <div class="text-[7.5px] uppercase tracking-widest text-slate-400 font-bold leading-none">ARMOR</div>
        <div class="w-16 sm:w-20 h-2.5 bg-slate-800 rounded-full overflow-hidden border border-slate-600 mt-0.5 p-0.5">
          <div id="healthBar" class="h-full bg-gradient-to-r from-emerald-500 to-green-400 rounded-full transition-all duration-150" style="width: 100%;"></div>
        </div>
      </div>
      <button id="soundToggleBtn" class="p-1 px-1.5 rounded-lg bg-zinc-900 border border-zinc-700 text-zinc-300 text-[9px] font-bold shadow hover:bg-zinc-800">
        🔊 SIREN
      </button>
    </div>
  </header>

  <!-- ============================================ -->
  <!-- MAIN ACTION CANVAS (Top-Down City Chase)      -->
  <!-- ============================================ -->
  <main class="relative w-full flex-1 min-h-0 flex items-center justify-center overflow-hidden bg-[#111116]">
    <canvas id="gameCanvas" class="w-full h-full block"></canvas>

    <!-- FLOATING CASH / WRECK POPUP NOTIFICATIONS -->
    <div id="notificationBanner" class="absolute top-4 left-0 right-0 flex items-center justify-center pointer-events-none hidden">
      <div id="notificationText" class="font-hud text-xs sm:text-sm font-black uppercase tracking-wider text-amber-300 bg-black/90 px-4 py-1.5 rounded-full border-2 border-amber-400 shadow-2xl">
        💥 POLICE CRUISER WRECKED! +$5,000
      </div>
    </div>

    <!-- TOUCH STEERING ZONES (Visible Onscreen Mobile Controls) -->
    <div class="absolute inset-0 flex pointer-events-auto z-10">
      <!-- LEFT STEER ZONE -->
      <div id="touchLeft" class="w-1/2 h-full touch-btn-press flex flex-col justify-end p-4 items-start opacity-70 hover:opacity-100 transition-opacity">
        <div class="bg-black/60 border-2 border-amber-500/70 text-amber-300 px-4 py-2 rounded-2xl flex items-center gap-2 shadow-2xl backdrop-blur-sm">
          <span class="text-xl">◀</span>
          <span class="font-hud text-xs font-black tracking-wider">DRIFT LEFT</span>
        </div>
      </div>

      <!-- RIGHT STEER ZONE -->
      <div id="touchRight" class="w-1/2 h-full touch-btn-press flex flex-col justify-end p-4 items-end opacity-70 hover:opacity-100 transition-opacity">
        <div class="bg-black/60 border-2 border-amber-500/70 text-amber-300 px-4 py-2 rounded-2xl flex items-center gap-2 shadow-2xl backdrop-blur-sm">
          <span class="font-hud text-xs font-black tracking-wider">DRIFT RIGHT</span>
          <span class="text-xl">▶</span>
        </div>
      </div>
    </div>
  </main>

  <!-- ============================================ -->
  <!-- BOTTOM CONTROLS & NITRO BOOST BAR           -->
  <!-- ============================================ -->
  <footer class="w-full max-w-lg mx-auto z-20 flex items-center justify-between px-3 py-1.5 bg-black/85 backdrop-blur-md border-t-2 border-amber-500/50 shadow-2xl">
    <!-- NITRO GAUGE & TURBO BUTTON -->
    <div class="flex items-center gap-2 flex-1 mr-3">
      <div class="text-[9px] font-hud font-black text-cyan-400 uppercase tracking-widest flex items-center gap-1">
        <span>⚡ NITRO</span>
      </div>
      <div class="flex-1 h-3 bg-zinc-900 rounded-full overflow-hidden border border-cyan-500/60 p-0.5">
        <div id="nitroBar" class="h-full bg-gradient-to-r from-cyan-400 to-blue-500 rounded-full transition-all duration-75 shadow-[0_0_10px_#06b6d4]" style="width: 100%;"></div>
      </div>
    </div>

    <!-- NITRO BOOST ACTION BUTTON -->
    <button id="nitroBtn" class="touch-btn-press px-4 py-1.5 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-black font-hud text-xs font-black uppercase tracking-wider shadow-[0_0_15px_rgba(6,182,212,0.8)] active:scale-95 transition">
      🚀 NITRO BOOST
    </button>
  </footer>

  <!-- ============================================ -->
  <!-- "BUSTED / WASTED" GAME OVER MODAL (GTA Style)-->
  <!-- ============================================ -->
  <div id="gameOverModal" class="fixed inset-0 bg-black/92 z-50 flex items-center justify-center p-4 backdrop-blur-md hidden">
    <div class="max-w-xs w-full bg-[#140808] border-3 border-rose-600 rounded-3xl p-5 shadow-[0_0_50px_rgba(239,68,68,0.6)] text-center space-y-3">
      <!-- WASTED / BUSTED LOGO -->
      <div class="w-16 h-16 mx-auto rounded-2xl bg-rose-950 border-2 border-rose-600 flex items-center justify-center text-3xl shadow-xl animate-pulse">
        🚨
      </div>

      <div>
        <h2 id="gameOverTitle" class="font-hud text-2xl font-black text-rose-500 uppercase tracking-widest drop-shadow-[0_0_15px_rgba(239,68,68,1)]">
          BUSTED!
        </h2>
        <p class="text-[10px] text-slate-400 font-bold tracking-wider">SWAT & POLICE INTERCEPTED YOUR ESCAPE</p>
      </div>

      <!-- HEIST STATS -->
      <div class="bg-black/70 p-3 rounded-2xl border border-rose-900/60 space-y-1.5 text-left text-xs">
        <div class="flex justify-between items-center">
          <span class="text-slate-400 font-bold">Loot Collected:</span>
          <span id="finalLootVal" class="font-hud font-black text-emerald-400 text-sm">$0</span>
        </div>
        <div class="flex justify-between items-center">
          <span class="text-slate-400 font-bold">Cops Wrecked:</span>
          <span id="finalCopsVal" class="font-hud font-black text-amber-400">0</span>
        </div>
        <div class="flex justify-between items-center">
          <span class="text-slate-400 font-bold">Survival Time:</span>
          <span id="finalTimeVal" class="font-hud font-black text-cyan-400">0s</span>
        </div>
        <div class="flex justify-between items-center border-t border-white/10 pt-1">
          <span class="text-slate-400 font-bold">Best Record:</span>
          <span id="finalBestVal" class="font-hud font-black text-amber-300">$0</span>
        </div>
      </div>

      <!-- RESTART GETAWAY -->
      <button id="retryGetawayBtn" class="w-full py-3 bg-gradient-to-r from-rose-600 via-amber-500 to-yellow-500 hover:brightness-110 text-black font-hud text-xs font-black uppercase tracking-wider rounded-2xl shadow-xl transition active:scale-95">
        START NEW HEIST ➔
      </button>
    </div>
  </div>

  <!-- ========================================================================= -->
  <!-- JAVASCRIPT: THE COMPLETE GTA STREET GETAWAY ACTION ENGINE                 -->
  <!-- ========================================================================= -->
  <script>
    /**
     * GTA: STREET GETAWAY — 5-STAR POLICE CHASE
     * - Top-down physics getaway driving with realistic drifting & tire smoke
     * - 5-Star Wanted Level AI Pursuit (Patrols, Interceptors, Roadblocks, SWAT Vans, Helicopter)
     * - Real-time synthesized 808 Trap Bass Beats, wailing police sirens & crash explosions
     * - Cash loot bags, near-miss adrenaline bonuses, nitro boost pads
     */

    // =========================================================================
    // 1. STREET TRAP & POLICE SIREN AUDIO ENGINE (Web Audio API)
    // =========================================================================
    class GtaAudioEngine {
      constructor() {
        this.ctx = null;
        this.muted = false;
        this.trapTimer = null;
        this.sirenOsc = null;
        this.sirenGain = null;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
          this.startTrapBeat();
          this.initSiren();
        }
        if (this.ctx.state === "suspended") {
          this.ctx.resume();
        }
      }

      toggleMute() {
        this.muted = !this.muted;
        if (this.sirenGain) {
          this.sirenGain.gain.setValueAtTime(this.muted ? 0 : 0.08, this.ctx.currentTime);
        }
        return !this.muted;
      }

      // Continuous Wailing Police Siren
      initSiren() {
        if (!this.ctx) return;
        this.sirenOsc = this.ctx.createOscillator();
        this.sirenGain = this.ctx.createGain();
        this.sirenOsc.type = "sawtooth";
        this.sirenGain.gain.setValueAtTime(0.06, this.ctx.currentTime);

        const lfo = this.ctx.createOscillator();
        const lfoGain = this.ctx.createGain();
        lfo.frequency.setValueAtTime(0.75, this.ctx.currentTime); // 0.75 Hz siren sweep
        lfoGain.gain.setValueAtTime(280, this.ctx.currentTime);

        this.sirenOsc.frequency.setValueAtTime(680, this.ctx.currentTime);
        lfo.connect(this.sirenOsc.frequency);

        this.sirenOsc.connect(this.sirenGain);
        this.sirenGain.connect(this.ctx.destination);

        this.sirenOsc.start();
        lfo.start();
      }

      // Heavy 808 Trap Beat Loop (Bass kick & trap hats)
      startTrapBeat() {
        let step = 0;
        setInterval(() => {
          if (!this.ctx || this.muted) return;
          const now = this.ctx.currentTime;

          // 808 Sub-Bass Kick on beat 0 and 4
          if (step % 4 === 0) {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = "sine";
            osc.frequency.setValueAtTime(140, now);
            osc.frequency.exponentialRampToValueAtTime(38, now + 0.18);
            gain.gain.setValueAtTime(0.4, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now);
            osc.stop(now + 0.3);
          }

          // Trap Hi-Hat on every step
          const hat = this.ctx.createOscillator();
          const hatGain = this.ctx.createGain();
          hat.type = "highpass";
          hat.frequency.setValueAtTime(7500, now);
          hatGain.gain.setValueAtTime(0.08, now);
          hatGain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
          hat.connect(hatGain);
          hatGain.connect(this.ctx.destination);
          hat.start(now);
          hat.stop(now + 0.05);

          step++;
        }, 160); // 94 BPM trap groove
      }

      // Engine Rev Sound
      playEngineRev(speedRatio) {
        if (!this.ctx || this.muted) return;
        // Pitch scales smoothly with speed
      }

      // Tire Screech on Drifting
      playTireDrift() {
        if (!this.ctx || this.muted) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = "triangle";
        osc.frequency.setValueAtTime(850 + Math.random() * 200, now);
        osc.frequency.linearRampToValueAtTime(620, now + 0.08);
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.1);
      }

      // Nitro Boost Whoosh
      playNitro() {
        if (!this.ctx || this.muted) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(180, now);
        osc.frequency.exponentialRampToValueAtTime(540, now + 0.25);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.38);
      }

      // Police Car Crash & Explosion
      playExplosion() {
        if (!this.ctx || this.muted) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(120, now);
        osc.frequency.exponentialRampToValueAtTime(25, now + 0.4);
        gain.gain.setValueAtTime(0.5, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.48);
      }

      // Cash Loot Pickup Chime
      playCashChime() {
        if (!this.ctx || this.muted) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(987.77, now); // B5
        osc.frequency.setValueAtTime(1318.51, now + 0.06); // E6
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.3);
      }
    }

    const sound = new GtaAudioEngine();

    // =========================================================================
    // 2. GAME STATE & VARIABLES
    // =========================================================================
    const STATE = {
      cash: 10000,
      bestCash: 10000,
      health: 100,
      nitro: 100,
      wantedStars: 1,
      copsWrecked: 0,
      startTime: Date.now(),
      elapsedSeconds: 0,
      isGameOver: false,

      // Touch Inputs
      steerLeft: false,
      steerRight: false,
      isNitroActive: false,

      // Entities
      cops: [],
      cashLoot: [],
      nitroPads: [],
      skidMarks: [],
      particles: [],
      buildings: [],

      // Helicopter spotlight (for 5 Stars)
      chopper: {
        x: 0,
        y: 0,
        spotlightRadius: 85
      }
    };

    // Load Best Score
    try {
      STATE.bestCash = parseInt(localStorage.getItem("gta_getaway_best") || "10000", 10);
    } catch (e) {}

    // =========================================================================
    // 3. PLAYER CAR (Getaway Muscle Car)
    // =========================================================================
    const player = {
      x: 0,
      y: 0,
      angle: -Math.PI / 2, // Facing North
      speed: 0,
      baseSpeed: 7.2,
      maxSpeed: 8.8,
      nitroMaxSpeed: 14.0,
      steerSpeed: 0.062,
      driftFactor: 0.94,
      width: 24,
      length: 46,
      color: '#fbbf24', // Black & Gold V8 Muscle Car
      accent: '#18181b'
    };

    // =========================================================================
    // 4. MAP & OBSTACLES (City Blocks, Alleys & Buildings)
    // =========================================================================
    const CITY_SIZE = 3600; // Large looping endless city
    const BLOCK_SIZE = 280;

    function initCityMap() {
      STATE.buildings = [];
      STATE.cashLoot = [];
      STATE.nitroPads = [];

      // Generate grid of city blocks with streets between them
      for (let bx = -CITY_SIZE / 2 + 100; bx < CITY_SIZE / 2 - 200; bx += BLOCK_SIZE + 160) {
        for (let by = -CITY_SIZE / 2 + 100; by < CITY_SIZE / 2 - 200; by += BLOCK_SIZE + 160) {
          // Leave central plaza (spawn area) 100% open
          if (bx + BLOCK_SIZE > -320 && bx < 320 && by + BLOCK_SIZE > -320 && by < 320) continue;

          STATE.buildings.push({
            x: bx,
            y: by,
            w: BLOCK_SIZE,
            h: BLOCK_SIZE,
            name: ['VICE CASINO', 'AMMO NATION', 'NITRO DOCKS', 'SAFEHOUSE', 'MAFIA TOWER', 'BANK VAULT', 'CLUB 808'][Math.floor(Math.random() * 7)],
            color: ['#1e1b4b', '#18181b', '#0f172a', '#172554', '#261b2e'][Math.floor(Math.random() * 5)],
            neonColor: ['#ef4444', '#06b6d4', '#f59e0b', '#ec4899', '#10b981'][Math.floor(Math.random() * 5)]
          });
        }
      }

      // Scatter Cash Loot Bags strictly on streets (not inside buildings)
      for (let i = 0; i < 45; i++) {
        spawnCashLoot();
      }

      // Scatter Nitro Turbo Pads on streets
      for (let i = 0; i < 22; i++) {
        spawnNitroPad();
      }
    }

    function spawnCashLoot() {
      let rx, ry, inside;
      let attempts = 0;
      do {
        rx = (Math.random() - 0.5) * (CITY_SIZE - 300);
        ry = (Math.random() - 0.5) * (CITY_SIZE - 300);
        inside = STATE.buildings.some(b => rx > b.x - 30 && rx < b.x + b.w + 30 && ry > b.y - 30 && ry < b.y + b.h + 30);
        attempts++;
      } while (inside && attempts < 25);

      STATE.cashLoot.push({
        x: rx,
        y: ry,
        val: Math.random() > 0.35 ? 5000 : 25000,
        radius: 18,
        bobOffset: Math.random() * Math.PI * 2
      });
    }

    function spawnNitroPad() {
      let rx, ry, inside;
      let attempts = 0;
      do {
        rx = (Math.random() - 0.5) * (CITY_SIZE - 300);
        ry = (Math.random() - 0.5) * (CITY_SIZE - 300);
        inside = STATE.buildings.some(b => rx > b.x - 30 && rx < b.x + b.w + 30 && ry > b.y - 30 && ry < b.y + b.h + 30);
        attempts++;
      } while (inside && attempts < 25);

      STATE.nitroPads.push({
        x: rx,
        y: ry,
        w: 36,
        h: 36
      });
    }

    // =========================================================================
    // 5. POLICE PURSUIT AI & WANTED LEVEL SYSTEM
    // =========================================================================
    class CopCar {
      constructor(type = 'patrol') {
        this.type = type; // 'patrol' | 'interceptor' | 'swat'
        this.width = type === 'swat' ? 30 : 22;
        this.length = type === 'swat' ? 52 : 44;
        this.speed = type === 'interceptor' ? 8.6 : (type === 'swat' ? 6.2 : 7.4);
        this.turnSpeed = type === 'interceptor' ? 0.058 : 0.045;
        this.health = type === 'swat' ? 3 : 1;

        // Spawn off-screen ahead or behind player on open street
        let attempts = 0;
        do {
          const spawnAngle = Math.random() * Math.PI * 2;
          const spawnDist = 450 + Math.random() * 140;
          this.x = player.x + Math.cos(spawnAngle) * spawnDist;
          this.y = player.y + Math.sin(spawnAngle) * spawnDist;
          attempts++;
        } while (attempts < 20 && STATE.buildings.some(b => this.x > b.x - 20 && this.x < b.x + b.w + 20 && this.y > b.y - 20 && this.y < b.y + b.h + 20));

        this.angle = Math.atan2(player.y - this.y, player.x - this.x);

        this.strobeTime = 0;
        this.isWrecked = false;
      }

      update() {
        if (this.isWrecked) return;

        // Vector pursuit towards player
        const targetAngle = Math.atan2(player.y - this.y, player.x - this.x);
        let diff = targetAngle - this.angle;
        while (diff < -Math.PI) diff += Math.PI * 2;
        while (diff > Math.PI) diff -= Math.PI * 2;

        this.angle += Math.sign(diff) * Math.min(Math.abs(diff), this.turnSpeed);
        this.x += Math.cos(this.angle) * this.speed;
        this.y += Math.sin(this.angle) * this.speed;

        this.strobeTime += 0.2;

        // Check collision with buildings (Cops wreck themselves!)
        for (let b of STATE.buildings) {
          if (this.x > b.x && this.x < b.x + b.w && this.y > b.y && this.y < b.y + b.h) {
            this.wreckCop();
            break;
          }
        }

        // Check collision with Player Car
        const distToPlayer = Math.hypot(player.x - this.x, player.y - this.y);
        if (distToPlayer < (this.length + player.length) * 0.45) {
          if (STATE.isNitroActive) {
            // Nitro ram destroys cop instantly!
            this.wreckCop();
            showNotification("🚀 NITRO RAM WRECK! +$7,500");
            STATE.cash += 7500;
          } else {
            // Cop rams player
            STATE.health -= this.type === 'swat' ? 22 : 12;
            updateHealthUI();
            sound.playExplosion();

            // Screen Shake
            triggerScreenShake();

            // Bounce apart
            player.x += Math.cos(this.angle) * 16;
            player.y += Math.sin(this.angle) * 16;
            this.x -= Math.cos(this.angle) * 20;
            this.y -= Math.sin(this.angle) * 20;

            if (STATE.health <= 0) {
              triggerGameOver("BUSTED!");
            }
          }
        }
      }

      wreckCop() {
        this.isWrecked = true;
        sound.playExplosion();
        triggerScreenShake();
        STATE.copsWrecked++;
        STATE.cash += 5000;
        updateCashUI();
        showNotification("💥 POLICE VEHICLE DESTROYED! +$5,000");

        // Spawn Fireball & Smoke particles
        for (let i = 0; i < 18; i++) {
          STATE.particles.push({
            x: this.x,
            y: this.y,
            vx: (Math.random() - 0.5) * 8,
            vy: (Math.random() - 0.5) * 8,
            radius: 8 + Math.random() * 12,
            alpha: 1.0,
            color: ['#ef4444', '#f97316', '#fbbf24', '#71717a'][Math.floor(Math.random() * 4)]
          });
        }
      }

      draw(ctx) {
        if (this.isWrecked) return;

        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);

        const w = this.width;
        const l = this.length;

        // Shadow
        ctx.beginPath();
        ctx.roundRect ? ctx.roundRect(-l / 2 + 3, -w / 2 + 4, l, w, 6) : ctx.rect(-l / 2 + 3, -w / 2 + 4, l, w);
        ctx.fillStyle = "rgba(0, 0, 0, 0.4)";
        ctx.fill();

        // Car Body
        ctx.beginPath();
        ctx.roundRect ? ctx.roundRect(-l / 2, -w / 2, l, w, 6) : ctx.rect(-l / 2, -w / 2, l, w);
        ctx.fillStyle = this.type === 'swat' ? '#0f172a' : (this.type === 'interceptor' ? '#18181b' : '#f8fafc');
        ctx.fill();
        ctx.strokeStyle = "#000000";
        ctx.lineWidth = 1.5;
        ctx.stroke();

        // Windshield & Windows
        ctx.fillStyle = "#1e293b";
        ctx.fillRect(-l * 0.1, -w * 0.4, l * 0.35, w * 0.8);

        // Police Roof Lightbar (Flashing Red & Blue Strobes!)
        const isRed = Math.sin(this.strobeTime * 8) > 0;
        ctx.fillStyle = isRed ? '#ef4444' : '#3b82f6';
        ctx.fillRect(-l * 0.05, -w * 0.35, l * 0.1, w * 0.7);

        // Strobe Glow Cone
        ctx.beginPath();
        ctx.arc(0, 0, 45, 0, Math.PI * 2);
        ctx.fillStyle = isRed ? 'rgba(239, 68, 68, 0.22)' : 'rgba(59, 130, 246, 0.22)';
        ctx.fill();

        ctx.restore();
      }
    }

    // Spawn Cops based on Wanted Stars
    function updatePoliceSpawner() {
      const maxCops = Math.min(10, STATE.wantedStars * 2);

      // Clean up wrecked or far cops
      STATE.cops = STATE.cops.filter(c => {
        if (c.isWrecked) return false;
        const dist = Math.hypot(c.x - player.x, c.y - player.y);
        return dist < 850;
      });

      while (STATE.cops.length < maxCops) {
        let type = 'patrol';
        if (STATE.wantedStars >= 4 && Math.random() > 0.5) type = 'swat';
        else if (STATE.wantedStars >= 2 && Math.random() > 0.4) type = 'interceptor';
        STATE.cops.push(new CopCar(type));
      }
    }

    // Update Wanted Stars based on time survived & cops wrecked
    function updateWantedLevel() {
      STATE.elapsedSeconds = Math.floor((Date.now() - STATE.startTime) / 1000);

      let stars = 1;
      if (STATE.elapsedSeconds > 80 || STATE.copsWrecked >= 8) stars = 5;
      else if (STATE.elapsedSeconds > 55 || STATE.copsWrecked >= 5) stars = 4;
      else if (STATE.elapsedSeconds > 35 || STATE.copsWrecked >= 3) stars = 3;
      else if (STATE.elapsedSeconds > 15 || STATE.copsWrecked >= 1) stars = 2;

      STATE.wantedStars = stars;

      // Update Star Icons in HUD
      const starItems = document.querySelectorAll(".star-item");
      starItems.forEach((el, idx) => {
        if (idx < stars) {
          el.className = "star-item wanted-active";
        } else {
          el.className = "star-item wanted-inactive";
        }
      });

      // 5-Star Police Strobe on screen edges
      const body = document.getElementById("appBody");
      if (stars >= 4) {
        body.classList.add("siren-strobe");
      } else {
        body.classList.remove("siren-strobe");
      }
    }

    // =========================================================================
    // 6. MAIN GAME CANVAS & GRAPHICS ENGINE
    // =========================================================================
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    function resizeGameCanvas() {
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener("resize", resizeGameCanvas);

    // =========================================================================
    // 7. MAIN UPDATE & RENDER LOOP
    // =========================================================================
    function gameLoop() {
      if (!STATE.isGameOver) {
        updatePhysics();
        updateWantedLevel();
        updatePoliceSpawner();
      }

      renderScene();
      requestAnimationFrame(gameLoop);
    }

    function updatePhysics() {
      // 1. Player Steering & Drifting
      if (STATE.steerLeft) {
        player.angle -= player.steerSpeed;
        sound.playTireDrift();
        spawnSkidMark();
      }
      if (STATE.steerRight) {
        player.angle += player.steerSpeed;
        sound.playTireDrift();
        spawnSkidMark();
      }

      // 2. Nitro Handling
      if (STATE.isNitroActive && STATE.nitro > 0) {
        player.speed = player.nitroMaxSpeed;
        STATE.nitro = Math.max(0, STATE.nitro - 0.7);
        spawnNitroFlames();
      } else {
        STATE.isNitroActive = false;
        player.speed = player.baseSpeed;
        // Nitro slow recharge
        STATE.nitro = Math.min(100, STATE.nitro + 0.15);
      }
      updateNitroUI();

      // 3. Move Player Forward
      player.x += Math.cos(player.angle) * player.speed;
      player.y += Math.sin(player.angle) * player.speed;

      // 3b. City Perimeter Highway Barriers
      const bound = CITY_SIZE / 2 - 80;
      if (Math.abs(player.x) > bound || Math.abs(player.y) > bound) {
        sound.playTireDrift();
        triggerScreenShake();
        if (player.x > bound) { player.x = bound; player.angle = Math.PI - player.angle; }
        if (player.x < -bound) { player.x = -bound; player.angle = Math.PI - player.angle; }
        if (player.y > bound) { player.y = bound; player.angle = -player.angle; }
        if (player.y < -bound) { player.y = -bound; player.angle = -player.angle; }
        showNotification("⚠️ POLICE BARRICADE! REBOUNDED");
      }

      // 4. Player Collision with Buildings
      for (let b of STATE.buildings) {
        if (player.x > b.x && player.x < b.x + b.w && player.y > b.y && player.y < b.y + b.h) {
          // Bounce off building
          sound.playExplosion();
          triggerScreenShake();
          STATE.health -= 15;
          updateHealthUI();
          player.speed = 2;
          player.x -= Math.cos(player.angle) * 20;
          player.y -= Math.sin(player.angle) * 20;
          if (STATE.health <= 0) {
            triggerGameOver("CRASHED & WASTED!");
          }
          break;
        }
      }

      // 5. Update Cops
      STATE.cops.forEach(cop => cop.update());

      // 6. Cash Loot Pickups
      for (let i = STATE.cashLoot.length - 1; i >= 0; i--) {
        const loot = STATE.cashLoot[i];
        const dist = Math.hypot(player.x - loot.x, player.y - loot.y);
        if (dist < loot.radius + player.length * 0.4) {
          sound.playCashChime();
          STATE.cash += loot.val;
          updateCashUI();
          showNotification(`💰 +$${loot.val.toLocaleString()} LOOT SECURED!`);
          STATE.cashLoot.splice(i, 1);
          spawnCashLoot(); // Respawn elsewhere
        }
      }

      // 7. Nitro Boost Pads Pickups
      for (let pad of STATE.nitroPads) {
        const dist = Math.hypot(player.x - pad.x, player.y - pad.y);
        if (dist < 35) {
          STATE.nitro = 100;
          STATE.isNitroActive = true;
          sound.playNitro();
          showNotification("⚡ NITRO BOOST ACTIVATED!");
          break;
        }
      }

      // 8. Update Helicopter Position (5 Stars)
      if (STATE.wantedStars >= 5) {
        STATE.chopper.x += (player.x - STATE.chopper.x) * 0.04;
        STATE.chopper.y += (player.y - STATE.chopper.y) * 0.04;
      }
    }

    function spawnSkidMark() {
      STATE.skidMarks.push({
        x: player.x - Math.cos(player.angle) * 16,
        y: player.y - Math.sin(player.angle) * 16,
        angle: player.angle,
        alpha: 0.65
      });
      if (STATE.skidMarks.length > 120) STATE.skidMarks.shift();
    }

    function spawnNitroFlames() {
      for (let i = 0; i < 2; i++) {
        STATE.particles.push({
          x: player.x - Math.cos(player.angle) * 22,
          y: player.y - Math.sin(player.angle) * 22,
          vx: -Math.cos(player.angle) * 6 + (Math.random() - 0.5) * 3,
          vy: -Math.sin(player.angle) * 6 + (Math.random() - 0.5) * 3,
          radius: 6 + Math.random() * 6,
          alpha: 0.9,
          color: ['#06b6d4', '#3b82f6', '#ffffff'][Math.floor(Math.random() * 3)]
        });
      }
    }

    function renderScene() {
      const w = canvas.width / (window.devicePixelRatio || 1);
      const h = canvas.height / (window.devicePixelRatio || 1);

      ctx.clearRect(0, 0, w, h);

      // Camera follows player smoothly
      ctx.save();
      ctx.translate(w / 2 - player.x, h / 2 - player.y);

      // 1. Draw Asphalt Road Grid
      drawAsphaltStreets();

      // 2. Draw Skid Marks
      for (let sm of STATE.skidMarks) {
        sm.alpha -= 0.003;
        ctx.save();
        ctx.translate(sm.x, sm.y);
        ctx.rotate(sm.angle);
        ctx.fillStyle = `rgba(15, 15, 18, ${Math.max(0, sm.alpha)})`;
        ctx.fillRect(-6, -8, 12, 3);
        ctx.fillRect(-6, 5, 12, 3);
        ctx.restore();
      }

      // 3. Draw Nitro Pads
      for (let pad of STATE.nitroPads) {
        ctx.save();
        ctx.translate(pad.x, pad.y);
        ctx.fillStyle = "#0891b2";
        ctx.beginPath();
        ctx.roundRect ? ctx.roundRect(-pad.w / 2, -pad.h / 2, pad.w, pad.h, 8) : ctx.rect(-pad.w / 2, -pad.h / 2, pad.w, pad.h);
        ctx.fill();
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 16px sans-serif";
        ctx.fillText("⚡", -8, 6);
        ctx.restore();
      }

      // 4. Draw Cash Bags ($$$)
      const time = Date.now() * 0.003;
      for (let loot of STATE.cashLoot) {
        const bob = Math.sin(time + loot.bobOffset) * 4;
        ctx.save();
        ctx.translate(loot.x, loot.y + bob);
        ctx.beginPath();
        ctx.arc(0, 0, 16, 0, Math.PI * 2);
        ctx.fillStyle = "#059669";
        ctx.fill();
        ctx.strokeStyle = "#34d399";
        ctx.lineWidth = 2.5;
        ctx.stroke();
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 14px Rajdhani, sans-serif";
        ctx.fillText("$", -4, 5);
        ctx.restore();
      }

      // 5. Draw City Buildings with Neon Billboards
      for (let b of STATE.buildings) {
        ctx.save();
        // Building Drop Shadow
        ctx.fillStyle = "rgba(0, 0, 0, 0.65)";
        ctx.fillRect(b.x + 8, b.y + 8, b.w, b.h);

        // Building Roof
        ctx.fillStyle = b.color;
        ctx.fillRect(b.x, b.y, b.w, b.h);
        ctx.strokeStyle = "rgba(255, 255, 255, 0.1)";
        ctx.lineWidth = 3;
        ctx.strokeRect(b.x, b.y, b.w, b.h);

        // Neon Sign
        ctx.font = "bold 13px Orbitron, sans-serif";
        ctx.fillStyle = b.neonColor;
        ctx.shadowColor = b.neonColor;
        ctx.shadowBlur = 14;
        ctx.fillText(b.name, b.x + 20, b.y + 35);
        ctx.restore();
      }

      // 6. Draw Police Cops
      STATE.cops.forEach(cop => cop.draw(ctx));

      // 7. Draw Player Muscle Car
      drawPlayerCar();

      // 8. Draw Particles (Explosions & Nitro)
      for (let i = STATE.particles.length - 1; i >= 0; i--) {
        const p = STATE.particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= 0.035;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = Math.max(0, p.alpha);
        ctx.fill();
        ctx.globalAlpha = 1.0;

        if (p.alpha <= 0) STATE.particles.splice(i, 1);
      }

      // 9. 5-Star Helicopter Searchlight Spotlight
      if (STATE.wantedStars >= 5) {
        ctx.save();
        ctx.beginPath();
        ctx.arc(STATE.chopper.x, STATE.chopper.y, STATE.chopper.spotlightRadius, 0, Math.PI * 2);
        const spotGrad = ctx.createRadialGradient(STATE.chopper.x, STATE.chopper.y, 10, STATE.chopper.x, STATE.chopper.y, STATE.chopper.spotlightRadius);
        spotGrad.addColorStop(0, 'rgba(254, 240, 138, 0.65)');
        spotGrad.addColorStop(1, 'rgba(254, 240, 138, 0)');
        ctx.fillStyle = spotGrad;
        ctx.fill();

        // Helicopter silhouette
        ctx.fillStyle = "rgba(15, 23, 42, 0.85)";
        ctx.beginPath();
        ctx.arc(STATE.chopper.x, STATE.chopper.y - 35, 18, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      ctx.restore();
    }

    function drawAsphaltStreets() {
      // Draw road lane dividers
      ctx.strokeStyle = "rgba(234, 179, 8, 0.25)";
      ctx.lineWidth = 3;
      ctx.setLineDash([20, 20]);

      for (let x = -CITY_SIZE / 2; x < CITY_SIZE / 2; x += 180) {
        ctx.beginPath();
        ctx.moveTo(x, -CITY_SIZE / 2);
        ctx.lineTo(x, CITY_SIZE / 2);
        ctx.stroke();
      }

      for (let y = -CITY_SIZE / 2; y < CITY_SIZE / 2; y += 180) {
        ctx.beginPath();
        ctx.moveTo(-CITY_SIZE / 2, y);
        ctx.lineTo(CITY_SIZE / 2, y);
        ctx.stroke();
      }
      ctx.setLineDash([]);
    }

    function drawPlayerCar() {
      ctx.save();
      ctx.translate(player.x, player.y);
      ctx.rotate(player.angle);

      const w = player.width;
      const l = player.length;

      // Soft Shadow
      ctx.beginPath();
      ctx.roundRect ? ctx.roundRect(-l / 2 + 4, -w / 2 + 5, l, w, 8) : ctx.rect(-l / 2 + 4, -w / 2 + 5, l, w);
      ctx.fillStyle = "rgba(0, 0, 0, 0.5)";
      ctx.fill();

      // Muscle Car Body (Gold Metallic & Black Hood)
      const carGrad = ctx.createLinearGradient(-l / 2, 0, l / 2, 0);
      carGrad.addColorStop(0, '#f59e0b');
      carGrad.addColorStop(0.3, '#fbbf24');
      carGrad.addColorStop(1, '#b45309');

      ctx.beginPath();
      ctx.roundRect ? ctx.roundRect(-l / 2, -w / 2, l, w, 8) : ctx.rect(-l / 2, -w / 2, l, w);
      ctx.fillStyle = carGrad;
      ctx.fill();
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 1.8;
      ctx.stroke();

      // Black Hood Stripes (V8 Dominator Style)
      ctx.fillStyle = "#18181b";
      ctx.fillRect(-l * 0.1, -w * 0.35, l * 0.4, w * 0.7);

      // Tinted Windshield
      ctx.fillStyle = "#09090b";
      ctx.fillRect(-l * 0.15, -w * 0.3, l * 0.25, w * 0.6);

      // Headlights Beam
      ctx.beginPath();
      ctx.moveTo(l / 2, -w * 0.35);
      ctx.lineTo(l / 2 + 120, -w * 0.85);
      ctx.lineTo(l / 2 + 120, w * 0.85);
      ctx.lineTo(l / 2, w * 0.35);
      ctx.closePath();
      const lightGrad = ctx.createLinearGradient(l / 2, 0, l / 2 + 120, 0);
      lightGrad.addColorStop(0, 'rgba(254, 240, 138, 0.4)');
      lightGrad.addColorStop(1, 'rgba(254, 240, 138, 0)');
      ctx.fillStyle = lightGrad;
      ctx.fill();

      ctx.restore();
    }

    // =========================================================================
    // 8. USER INTERACTION & TOUCH STEERING CONTROLS
    // =========================================================================
    const leftZone = document.getElementById("touchLeft");
    const rightZone = document.getElementById("touchRight");
    const nitroBtn = document.getElementById("nitroBtn");

    leftZone.addEventListener("pointerdown", (e) => {
      sound.init();
      STATE.steerLeft = true;
    });
    leftZone.addEventListener("pointerup", () => STATE.steerLeft = false);
    leftZone.addEventListener("pointerleave", () => STATE.steerLeft = false);
    leftZone.addEventListener("pointercancel", () => STATE.steerLeft = false);

    rightZone.addEventListener("pointerdown", (e) => {
      sound.init();
      STATE.steerRight = true;
    });
    rightZone.addEventListener("pointerup", () => STATE.steerRight = false);
    rightZone.addEventListener("pointerleave", () => STATE.steerRight = false);
    rightZone.addEventListener("pointercancel", () => STATE.steerRight = false);

    nitroBtn.addEventListener("pointerdown", () => {
      sound.init();
      if (STATE.nitro > 15) {
        STATE.isNitroActive = true;
        sound.playNitro();
        triggerScreenShake();
      }
    });
    nitroBtn.addEventListener("pointerup", () => STATE.isNitroActive = false);
    nitroBtn.addEventListener("pointerleave", () => STATE.isNitroActive = false);
    nitroBtn.addEventListener("pointercancel", () => STATE.isNitroActive = false);

    window.addEventListener("pointerdown", () => sound.init(), { once: true });

    // Keyboard support for desktop testing
    window.addEventListener("keydown", (e) => {
      sound.init();
      if (e.key === "ArrowLeft" || e.key === "a") STATE.steerLeft = true;
      if (e.key === "ArrowRight" || e.key === "d") STATE.steerRight = true;
      if (e.key === " " || e.key === "Shift") {
        if (STATE.nitro > 15) {
          STATE.isNitroActive = true;
          sound.playNitro();
        }
      }
    });

    window.addEventListener("keyup", (e) => {
      if (e.key === "ArrowLeft" || e.key === "a") STATE.steerLeft = false;
      if (e.key === "ArrowRight" || e.key === "d") STATE.steerRight = false;
      if (e.key === " " || e.key === "Shift") STATE.isNitroActive = false;
    });

    // =========================================================================
    // 9. UI UPDATES, NOTIFICATIONS & GAME OVER
    // =========================================================================
    function updateCashUI() {
      document.getElementById("cashVal").innerText = `$${STATE.cash.toLocaleString()}`;
      if (STATE.cash > STATE.bestCash) {
        STATE.bestCash = STATE.cash;
        try { localStorage.setItem("gta_getaway_best", STATE.bestCash); } catch (e) {}
      }
    }

    function updateHealthUI() {
      const pct = Math.max(0, STATE.health);
      const bar = document.getElementById("healthBar");
      bar.style.width = `${pct}%`;
      if (pct < 35) {
        bar.className = "h-full bg-gradient-to-r from-rose-600 to-red-500 rounded-full animate-pulse";
      } else {
        bar.className = "h-full bg-gradient-to-r from-emerald-500 to-green-400 rounded-full";
      }
    }

    function updateNitroUI() {
      document.getElementById("nitroBar").style.width = `${STATE.nitro}%`;
    }

    function triggerScreenShake() {
      const body = document.getElementById("appBody");
      body.classList.remove("screen-shake");
      void body.offsetWidth; // Reflow
      body.classList.add("screen-shake");
    }

    function showNotification(text) {
      const banner = document.getElementById("notificationBanner");
      const label = document.getElementById("notificationText");
      label.innerText = text;
      banner.classList.remove("hidden");
      setTimeout(() => banner.classList.add("hidden"), 1300);
    }

    function triggerGameOver(title) {
      STATE.isGameOver = true;
      document.getElementById("gameOverTitle").innerText = title;
      document.getElementById("finalLootVal").innerText = `$${STATE.cash.toLocaleString()}`;
      document.getElementById("finalCopsVal").innerText = STATE.copsWrecked;
      document.getElementById("finalTimeVal").innerText = `${STATE.elapsedSeconds}s`;
      document.getElementById("finalBestVal").innerText = `$${STATE.bestCash.toLocaleString()}`;
      document.getElementById("gameOverModal").classList.remove("hidden");
    }

    document.getElementById("retryGetawayBtn").addEventListener("click", () => {
      sound.init();
      document.getElementById("gameOverModal").classList.add("hidden");
      resetGame();
    });

    document.getElementById("soundToggleBtn").addEventListener("click", () => {
      sound.init();
      const on = sound.toggleMute();
      document.getElementById("soundToggleBtn").innerText = on ? "🔊 SIREN" : "🔇 MUTED";
    });

    function resetGame() {
      STATE.isGameOver = false;
      STATE.cash = 10000;
      STATE.health = 100;
      STATE.nitro = 100;
      STATE.copsWrecked = 0;
      STATE.wantedStars = 1;
      STATE.startTime = Date.now();
      STATE.elapsedSeconds = 0;
      STATE.cops = [];
      STATE.skidMarks = [];
      STATE.particles = [];

      player.x = 0;
      player.y = 0;
      player.angle = -Math.PI / 2;
      player.speed = player.baseSpeed;

      updateCashUI();
      updateHealthUI();
      initCityMap();
    }

    // START ENGINE
    resizeGameCanvas();
    resetGame();
    requestAnimationFrame(gameLoop);
  </script>
</body>
